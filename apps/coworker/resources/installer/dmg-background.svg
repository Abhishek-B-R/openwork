<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="600" viewBox="0 0 760 600">
  <rect width="760" height="600" fill="#f3f4f6"/>
  <defs>
    <!-- The same glasses and silhouette as the white mark, in quiet office colors. -->
    <symbol id="office-coworker" viewBox="0 0 128 128">
      <path d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="currentColor" opacity=".15" transform="translate(4 3)"/>
      <path d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="inherit"/>
      <g fill="#354052">
        <rect x="34.5" y="50" width="6" height="14" rx="3"/>
        <rect x="79.5" y="50" width="6" height="14" rx="3"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4.6">
        <circle cx="37.5" cy="57" r="17.5"/><circle cx="82.5" cy="57" r="17.5"/>
        <path d="M57.5 57c1.25-4 3.75-4 5 0M15 57h4.5M100.5 57h4.5"/>
      </g>
    </symbol>
    <g id="office-cubicle">
      <rect x="1" y="8" width="53" height="49" rx="3" fill="#e8edf3" stroke="#c3cddb" stroke-width=".8"/>
      <path d="M1 8V59M54 8V59" stroke="#b5c2d3" stroke-width="1.2"/>
      <path d="M28 45v-5m-5 5h10" fill="none" stroke="#aabbd0" stroke-width="1"/>
      <rect x="20" y="25" width="23" height="16" rx="2" fill="#f8fafc" stroke="#b1c1d5" stroke-width=".8"/>
      <path d="M24 30h10m-10 4h15" stroke="#d0d9e6" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g id="office-desk">
      <path d="M1 47h53v4H1Z" fill="#fcfdff" stroke="#c3cddb" stroke-width=".7"/>
      <path d="M5 51v8m45-8v8" stroke="#c3cddb" stroke-width="1"/>
      <path d="M24 44h14" stroke="#bdcadd" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <image data-brand="white-coworker" x="30" y="20" width="48" height="48" xlink:href="../../public/open-coworker.svg"/>
    <text x="80" y="48" font-size="14" font-weight="600" letter-spacing="-.2" fill="#303744">Open Coworker</text>
    <text x="720" y="48" text-anchor="end" font-size="11.5" font-weight="450" fill="#737c8b">Local by default</text>

    <!-- A miniature office sits quietly either side of the welcome. -->
    <g data-decoration="tiny-office-left" opacity=".48" transform="translate(24 94) rotate(-6 55 35)">
      <g transform="translate(0 7)">
        <use xlink:href="#office-cubicle"/>
        <use xlink:href="#office-coworker" x="3" y="18" width="29" height="29" fill="#bdd0ea" color="#617faa"/>
        <use xlink:href="#office-desk"/>
      </g>
      <g transform="translate(56 0)">
        <use xlink:href="#office-cubicle"/>
        <use xlink:href="#office-coworker" x="3" y="18" width="29" height="29" fill="#d6cae7" color="#9072ad"/>
        <use xlink:href="#office-desk"/>
      </g>
    </g>
    <g data-decoration="tiny-office-right" opacity=".48" transform="translate(626 94) rotate(6 55 35)">
      <g>
        <use xlink:href="#office-cubicle"/>
        <use xlink:href="#office-coworker" x="3" y="18" width="29" height="29" fill="#c1dccf" color="#548f7c"/>
        <use xlink:href="#office-desk"/>
      </g>
      <g transform="translate(56 7)">
        <use xlink:href="#office-cubicle"/>
        <use xlink:href="#office-coworker" x="3" y="18" width="29" height="29" fill="#ecd0bc" color="#ab7f64"/>
        <use xlink:href="#office-desk"/>
      </g>
    </g>

    <text x="380" y="118" text-anchor="middle" font-size="30" font-weight="650" letter-spacing="-.9" fill="#171c26">Welcome to your new team</text>
    <text x="380" y="148" text-anchor="middle" font-size="14" font-weight="450" fill="#687181">Drag Open Coworker into Applications.</text>

    <!-- Native Finder icons and their labels sit inside these quiet inset surfaces. -->
    <rect x="76" y="190" width="208" height="192" rx="28" fill="#e9ecf1"/>
    <rect x="76" y="188" width="208" height="192" rx="28" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="180" y="214" text-anchor="middle" font-size="10" font-weight="550" letter-spacing="1.4" fill="#89919e">01 · DRAG</text>

    <rect x="476" y="190" width="208" height="192" rx="28" fill="#e9ecf1"/>
    <rect x="476" y="188" width="208" height="192" rx="28" fill="#ffffff" fill-opacity=".8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="580" y="214" text-anchor="middle" font-size="10" font-weight="550" letter-spacing="1.4" fill="#89919e">02 · DROP HERE</text>

    <path d="M338 282h82m-8-8 8 8-8 8" fill="none" stroke="#aab3c1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M76 409h608" stroke="#dce0e6" stroke-width="1"/>
    <text x="380" y="438" text-anchor="middle" font-size="13" font-weight="550" fill="#434c5b">Launch Open Coworker from Applications.</text>
    <text x="380" y="461" text-anchor="middle" font-size="11.5" font-weight="450" fill="#7d8695">Once it’s in place, you can eject this installer.</text>
  </g>
</svg>
